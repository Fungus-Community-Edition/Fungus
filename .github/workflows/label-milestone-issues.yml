name: Label Milestone Issues

on:
  issues:
    types: [milestoned]

jobs:
  label-milestone-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Add 'milestoneTask' label
        uses: actions-ecosystem/action-add-labels@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          labels: milestoneTask
